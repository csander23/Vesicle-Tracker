[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesicletrack"
version = "0.1.0"
description = "Parameterised detection, tracking and movement scoring of intracellular vesicles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-image>=0.19",
    "matplotlib>=3.5",
    "pyyaml>=5.4",
    "tifffile>=2021.7",
    "trackpy>=0.5",
    "photutils>=1.5",
    "astropy>=5.0",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.5"]
nd2 = ["nd2>=0.7"]
fast = ["pyarrow>=8"]
notebook = ["jupyterlab>=3", "ipywidgets>=7", "tqdm>=4"]
all = ["opencv-python-headless>=4.5", "nd2>=0.7", "pyarrow>=8", "tqdm>=4"]

[project.scripts]
vesicletrack = "vesicletrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
