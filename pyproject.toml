[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesicletrack"
version = "0.2.0"
description = "Detection, tracking and movement scoring of intracellular vesicles with deepBLINK"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tifffile>=2023.7",
    "trackpy>=0.6",
    "tensorflow>=2.16,<2.21",
    "tf-keras>=2.16",
    "deepblink>=0.1.4",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
nd2 = ["nd2>=0.7"]
fast = ["pyarrow>=14"]
notebook = ["jupyterlab>=4", "ipywidgets>=8", "tqdm>=4"]
test = ["pytest>=7"]
all = ["opencv-python-headless>=4.8", "nd2>=0.7", "pyarrow>=14", "jupyterlab>=4",
       "ipywidgets>=8", "tqdm>=4", "pytest>=7"]

[project.scripts]
vesicletrack = "vesicletrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vesicletrack = ["models/*.h5"]
