name: vesicletrack
channels: [conda-forge]
dependencies:
  - python=3.11
  - ffmpeg            # needed only for video output
  - pip
  # Everything Python comes from pip so that TensorFlow, deepBLINK and the compiled
  # scientific packages share one NumPy build. Mixing conda and pip wheels here
  # produced a binary mismatch on macOS arm64.
  - pip:
      - -e .[all]
