# vesicletrack parameters.
#
# Defaults were validated on 60 s spinning-disk recordings of Rab5-RFP endosomes in
# glia at ~22 fps. Two fields MUST be checked for a new dataset - dt_seconds and
# um_per_px - because every rate in the output scales through them while nothing in
# the images looks wrong if they are set incorrectly.

dt_seconds: 0.0446        # frame interval, seconds. REQUIRED.
um_per_px: null           # pixel size; null keeps everything in pixels
output_dir: output

drift:
  enabled: true           # stage drift reads as directed transport in EVERY vesicle
  smoothing_sigma: 6.0    # blur for registration; locks onto static structure
  reference_frames: 20
  median_filter: 5
  min_span_px: 0.5

detect:
  method: dao
  psf_sigma_px: 1.3       # approximate spot sigma - set from your PSF
  threshold_sigma: 3.0    # lower = more detections and more noise
  roundness: 0.7          # rejects streaks and edges
  min_separation_px: 4.0  # NMS radius; stops one vesicle giving several peaks
  background_sigma: 0.0   # >0 subtracts a gaussian background first

link:
  search_range_px: 3.0    # max frame-to-frame step; too large invites identity swaps
  memory_frames: 15       # frames a vesicle may blink out and still be relinked
  min_length_frames: 40   # shorter tracks have no measurable direction
  merge_radius_px: 4.0    # co-located fragments are one vesicle

metrics:
  tau_frames: 22          # coarse-graining for run detection (~1 s at 22 fps)
  tau_directed_frames: 90 # timescale defining "consistent direction" (~4 s)
  max_turn_deg: 60.0
  min_run_disp_px: 1.0
  min_run_steps: 2        # must be >= 2; 1 collapses directed onto gross path
  n_permutations: 200     # per-vesicle null; 0 disables the p-value
  random_seed: 0

classify:
  use_permutation: true   # mover = beats its OWN null, not a fixed threshold
  p_threshold: 0.05
  mover_rate_px_per_s: 0.15   # used only when use_permutation is false
  mover_min_net_px: 4.0
  exclude_max_step_px: 5.0    # single jump this large = suspected identity swap
  exclude_n_big_steps: 5
  big_step_px: 3.0

render:
  three_panel: true       # RAW | ALL VESICLES | CLASSIFIED
  per_vesicle_images: true
  per_vesicle_videos: false
  overview_video: false
  max_vesicle_outputs: 25 # cap on per-vesicle files; reported in summary.json
  trail_frames: 40
  frame_step: 4
  fps: 20
  dpi: 150
  percentiles: [1.0, 99.7]
  ffmpeg: ffmpeg
